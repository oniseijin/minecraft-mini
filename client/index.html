<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Minecraft Mini</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #87ceeb;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app canvas {
        display: block;
      }

      #overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: linear-gradient(to bottom, #6db3e8 0%, #87ceeb 55%, #c9e8f9 100%);
      }

      #overlay.hidden {
        display: none;
      }

      /* While booting: not clickable, no pulsing on the status line. */
      #overlay.loading {
        pointer-events: none;
      }

      #overlay.loading p {
        animation: none;
        opacity: 0.85;
      }

      #hotbar {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        display: flex;
        gap: 4px;
        padding: 4px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }

      #hotbar .slot {
        position: relative;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
      }

      #hotbar .slot img {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
      }

      #hotbar .slot .num {
        position: absolute;
        top: 1px;
        left: 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        color: #eee;
        text-shadow: 0 1px 2px #000;
      }

      #hotbar .slot.selected {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      }

      .overlay-card {
        text-align: center;
        padding: 48px 72px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow:
          0 12px 40px rgba(20, 60, 90, 0.25),
          0 2px 8px rgba(20, 60, 90, 0.15);
        backdrop-filter: blur(6px);
        user-select: none;
      }

      .overlay-card h1 {
        font-size: 44px;
        letter-spacing: 1px;
        color: #2d5a27;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
      }

      .overlay-card p {
        margin-top: 12px;
        font-size: 18px;
        color: #456;
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }

      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 20;
        padding: 4px 8px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.4;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }

      /* Centered plus-shaped crosshair. mix-blend-mode: difference keeps it
         visible against both bright sky and dark blocks. Hidden while the
         pointer is not locked (main.ts toggles the class). */
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 18px;
        height: 18px;
        z-index: 14;
        mix-blend-mode: difference;
        pointer-events: none;
        user-select: none;
      }

      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
      }

      #crosshair::before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }

      #crosshair::after {
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        transform: translateY(-50%);
      }

      #crosshair.hidden {
        display: none;
      }

      /* Transient HUD toast (mouse sensitivity, …) above the hotbar. */
      #toast {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 16;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        user-select: none;
      }

      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay" class="loading">
      <div class="overlay-card">
        <h1>Minecraft Mini</h1>
        <p id="overlay-status">Loading textures…</p>
      </div>
    </div>

    <div id="hotbar"></div>

    <div id="crosshair" class="hidden"></div>
    <div id="toast"></div>

    <div id="debug">FPS: --</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
